# ============================================================================
# dsh-firefly-pet 的 bundle patch —— 把本地桌宠插件挂进 DSH 配置树
# ============================================================================
# 本地版：给一台机器自己用，不做商城上架，所以没有 entry id 契约压力。
# 但 id 仍与包名保持一致，方便以后真去上架时不用改。
# ============================================================================

- insert:
    - id: dsh-firefly-pet
      name: 'dsh-firefly-pet'
